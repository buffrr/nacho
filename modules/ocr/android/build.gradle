plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ocr'
version = '0.1.0'

android {
  namespace "expo.modules.ocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // CameraX — live preview + frame analysis (mirrors the iOS AVCaptureSession).
  def cameraxVersion = "1.3.4"
  implementation "androidx.camera:camera-core:${cameraxVersion}"
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
  implementation "androidx.camera:camera-view:${cameraxVersion}"

  // ML Kit — on-device OCR (Latin) + QR, bundled models (work offline / in the
  // emulator, no Play-services model download). Mirrors iOS Vision + metadata QR.
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "com.google.mlkit:barcode-scanning:17.3.0"
}
